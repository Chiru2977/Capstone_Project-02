<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deployment Test Application</title>
    <style>
        /* Smooth scrolling across the entire page */
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Container with a subtle fade-in and slide-up load animation */
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transform: translateY(20px);
            opacity: 0;
            animation: appLoad 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            will-change: transform, opacity;
        }

        /* Pulsing indicator loop using composite properties for peak performance */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            animation: pulse 1.5s infinite alternate ease-in-out;
        }

        h1 {
            margin: 0 0 0.5rem 0;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        p {
            color: #94a3b8;
            margin: 0 0 2rem 0;
            line-height: 1.5;
        }

        /* Interactive smooth button transition */
        .action-btn {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.75rem;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.2);
        }

        .action-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        /* Animation Definitions */
        @keyframes appLoad {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes pulse {
            from {
                transform: scale(0.8);
                opacity: 0.5;
            }
            to {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        /* Performance optimization for users who prefer reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .card, .pulse-dot, .action-btn {
                animation: none !important;
                transition: none !important;
                transform: none !important;
                opacity: 1 !important;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="status-badge">
            <span class="pulse-dot"></span>
            Deployment Live
        </div>
        <h1>Success!</h1>
        <p>Your application was successfully deployed. All smooth CSS structural frames and high-performance layout engines are verified active.</p>
        <button class="action-btn" onclick="celebrate()">Run Test Trigger</button>
    </div>

    <script>
        // Smooth JavaScript-driven feedback loop using scale adjustments
        function celebrate() {
            const btn = document.querySelector('.action-btn');
            btn.textContent = '🎉 Test Successful!';
            btn.style.background = 'linear-gradient(135deg, #22c55e 0%, #16a34a 100%)';
            
            // Revert text back after a brief delay
            setTimeout(() => {
                btn.textContent = 'Run Test Trigger';
                btn.style.background = 'linear-gradient(135deg, #6366f1 0%, #4f46e5 100%)';
            }, 2000);
        }
    </script>
</body>
</html>
