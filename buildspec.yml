version: 0.2

phases:

  pre_build:
    commands:
      - echo "========================================="
      - echo "Starting CodeBuild"
      - echo "========================================="
      - echo "Logging in to Docker Hub..."
      - echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

  build:
    commands:
      - echo "========================================="
      - echo "Validating application"
      - echo "========================================="
      - test -f application/index.html
      - test -f application/Dockerfile
      - test -f application/images/github3.jpg

      - echo "========================================="
      - echo "Building Docker image"
      - echo "========================================="
      - export IMAGE_TAG="$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - export IMAGE_NAME="$DOCKERHUB_USERNAME/intellipaat-website"

      - docker build -t "$IMAGE_NAME:$IMAGE_TAG" ./application

      - echo "========================================="
      - echo "Testing Docker container"
      - echo "========================================="
      - docker run -d --name intellipaat-test -p 8080:80 "$IMAGE_NAME:$IMAGE_TAG"
      - sleep 5
      - curl -f http://127.0.0.1:8080
      - docker rm -f intellipaat-test

      - echo "========================================="
      - echo "Creating latest tag"
      - echo "========================================="
      - docker tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:latest"

  post_build:
    commands:
      - echo "========================================="
      - echo "Pushing Docker images"
      - echo "========================================="
      - docker push "$IMAGE_NAME:$IMAGE_TAG"
      - docker push "$IMAGE_NAME:latest"

      - echo "========================================="
      - echo "Build completed"
      - echo "========================================="
      - echo "IMAGE_TAG=$IMAGE_TAG"
      - echo "IMAGE=$IMAGE_NAME:$IMAGE_TAG"
      - echo "Build completed on $(date)"
